# One-time scheduled publish — "Send Someone Else"
# ------------------------------------------------
# Flips src/content/words/send-someone-else.mdx from status:"drafted" to
# status:"published" and pushes to main, so Netlify redeploys and the essay
# goes live shortly after NOON CT on Sunday, July 5, 2026 — after Dexter
# preaches The Potter's House 30th anniversary service.
#
# Why a dedicated workflow (not daily-rebuild.yml):
#   - daily-rebuild fires ~00:05 CT, so a noon-dated essay wouldn't flip until
#     ~00:05 the NEXT day. This fires at 12:05 CT on the target day itself.
#   - The essay is intentionally `drafted` (fully hidden — no "coming soon"
#     teaser leak) until this job flips it. daily-rebuild can't publish a draft.
#
# Behavior:
#   - Runs 17:05 UTC on Jul 5 (= 12:05 CDT). GitHub cron is best-effort and may
#     run a few minutes late — fine; publishedDate is 12:00 CT so the date-gate
#     is already open by the time it deploys.
#   - Idempotent + guarded: only acts in 2026 AND only if still `drafted`.
#     Safe to leave in the repo; delete any time after 2026-07-05.
#   - Manual fallback: run it any time from the Actions tab (workflow_dispatch).

name: Publish — Send Someone Else (2026-07-05 noon CT)

on:
  schedule:
    - cron: '5 17 5 7 *'   # 17:05 UTC Jul 5 = 12:05 America/Chicago (CDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Flip drafted -> published (guarded) and push
        run: |
          set -euo pipefail
          FILE="src/content/words/send-someone-else.mdx"

          YEAR="$(date -u +%Y)"
          if [ "$YEAR" != "2026" ]; then
            echo "Not 2026 (year=$YEAR) — one-time job, nothing to do."
            exit 0
          fi

          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE not found on main."
            exit 1
          fi

          if ! grep -q '^status: "drafted"$' "$FILE"; then
            echo "Already published (or status not drafted) — nothing to do."
            exit 0
          fi

          perl -i -pe 's/^status: "drafted"$/status: "published"/' "$FILE"
          echo "Flipped status to published:"
          grep -nE '^status:|^publishedDate:' "$FILE"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "publish(send-someone-else): go live for the 30th (noon CT 2026-07-05)"
          git push origin main
